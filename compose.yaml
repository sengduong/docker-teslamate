services:
  teslamate:
    image: teslamate/teslamate:latest
    restart: always
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY} #replace with a secure key to encrypt your Tesla API tokens
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASS=${POSTGRES_PASSWORD} #insert your secure database password!
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_HOST=database
      - VIRTUAL_HOST=${FQDN_TM}
      - CHECK_ORIGIN=true
      - TZ=${TM_TZ}
      - MQTT_HOST=mosquitto
    #ports:
    #  - 4000:4000
    volumes:
      - ./import:/opt/app/import
    cap_drop:
      - all
    networks:
      - teslamate_internal
      - caddy-2_caddy_net

  database:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} #insert your secure database password!
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-db:/var/lib/postgresql/data
    networks:
      - teslamate_internal

  grafana:
    image: teslamate/grafana:latest
    restart: always
    environment:
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASS=${POSTGRES_PASSWORD}  #insert your secure database password!
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_HOST=database
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_DOMAIN=${FQDN_TM}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    #ports:
    #  - 3000:3000
    volumes:
      - teslamate-grafana-data:/var/lib/grafana
    networks:
      - teslamate_internal
      - caddy-2_caddy_net

networks:
  teslamate_internal:
  caddy-2_caddy_net:
    external: true
    name: "caddy-2_caddy_net"

volumes:
  postgres-db:
    driver_opts:
      type: "nfs"
      o: ${TESLAMATE_NFS_PATH}
      device: ${TESLAMATE_NFS_DEVICE_POSTGRESDB}
  teslamate-grafana-data:
    driver_opts:
      type: "nfs"
      o: ${TESLAMATE_NFS_PATH}
      device: ${TESLAMATE_NFS_DEVICE_GRAFANADATA}
